# Fails a pull request until every contributor has signed CLA.md.
# Section 11 of that file accepts a signature made with a GitHub account
# through CLA Assistant. Signatures are stored on the cla-signatures
# branch of this repository, which must not be protected.
name: cla

# //review:ignore zizmor/dangerous-triggers does not check out the pull request or run its code; CLA Assistant has to run on pull_request_target to record a signature in this repository
on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# What the action's README requires. contents is write because the
# signatures stay in this repository, not a remote one.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1, the last release; the repository is archived
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://mordaunt.dev/code/leita/CLA.md
          branch: cla-signatures
